# Apply after compose.yaml through ./deploy/tunnel.sh.
# Requires a recent Docker Compose supporting !reset (use 2.24.4 or later).
services:
  web:
    ports: !reset []
    volumes:
      - ./Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
    networks: [frontend, tunnel_ingress]
  api:
    environment:
      PAPERLEET_JUDGE_TIMEOUT_SECONDS: "90"
  judge:
    environment:
      PAPERLEET_JUDGE_TIMEOUT_SECONDS: "90"
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    command: [tunnel, --no-autoupdate, run]
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set your Cloudflare tunnel token in deploy/.env}
    networks: [tunnel_ingress, tunnel_egress]
    depends_on: [web]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
networks:
  # Only the connector shares this ingress network with the web proxy.
  tunnel_ingress:
    internal: true
  tunnel_egress: {}

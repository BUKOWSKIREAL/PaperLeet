name: README star history

on:
  schedule:
    - cron: '17 17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/readme_metrics.py
      - scripts/metrics_lettering.py
      - scripts/assets/metrics-lettering/**
      - .github/workflows/readme-metrics.yml

permissions:
  contents: read

concurrency:
  group: readme-star-history
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Hongyang-Du/PaperLeet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh the offline repository's star chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/readme_metrics.py --output-dir docs/metrics
      - name: Commit updated star charts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add docs/metrics/stars.json docs/metrics/stars.svg docs/metrics/stars-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh offline star history'
          gh auth setup-git
          git pull --rebase origin main
          git push origin HEAD:main

name: README metrics

on:
  schedule:
    - cron: '17 17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/readme_metrics.py
      - scripts/metrics_lettering.py
      - scripts/assets/metrics-lettering/**
      - .github/workflows/readme-metrics.yml

permissions:
  contents: write

concurrency:
  group: readme-metrics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Hongyang-Du/PaperLeet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate aggregate charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAPERLEET_METRICS_URL: ${{ vars.PAPERLEET_METRICS_URL || 'https://paperleet.com/api/public/metrics' }}
        run: >-
          python scripts/readme_metrics.py
          --repo "$GITHUB_REPOSITORY"
          --users-url "$PAPERLEET_METRICS_URL"
          --output-dir docs/metrics
      - name: Commit updated charts
        run: |
          git add docs/metrics
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh project metrics'
          git pull --rebase origin main
          git push origin HEAD:main
